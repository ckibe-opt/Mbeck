name: mbeck_business
description: Mbeck Business - Complete business management solution.
publish_to: 'none'
version: 2.1.3+17

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^8.0.0
  
  # Database
  sqflite: ^2.3.0
  sqflite_sqlcipher: ^3.0.0+1
  path: ^1.9.0
  shared_preferences: ^2.2.2
  uuid: ^4.0.0
  
  # Cloud Sync (Phase 2)
  supabase_flutter: ^2.0.0
  connectivity_plus: ^6.0.0
  web_socket_channel: ^2.4.0
  stream_channel: ^2.1.0
  
  # Data Processing
  csv: ^6.0.0
  intl: ^0.20.2
  collection: ^1.18.0
  crypto: ^3.0.3 
  
  # File Handling, Sharing & Direct Messaging
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  share_plus: ^9.0.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0 # NEW: For direct WhatsApp messaging without saving contacts
  image_picker: ^1.0.7

  # Camera & AI
  camera: ^0.11.0
  tflite_flutter: ^0.12.1 
  image: ^4.1.3           
  
  # Archiving
  archive: ^3.6.1
  flutter_slidable: ^4.0.3
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  network_info_plus: ^7.0.0
  bonsoir: ^6.0.1
  # Shared Logic Package
  mbeck_shared:
    path: ./packages/mbeck_shared
  mbeck_modules:
    path: ./packages/mbeck_modules
  mobile_scanner: ^7.1.4
  
  # Phase 2: Biometric Auth & Secure Storage
  local_auth: ^2.1.0
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.2.0

  # FFI for Windows/Linux Support
  sqflite_common_ffi: ^2.3.0
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^20.0.0
  flutter_dotenv: ^6.0.0
  http: ^1.6.0
  purchases_flutter: ^8.11.0
  pdf: ^3.12.0
  printing: ^5.13.1
  firebase_core: ^3.4.0
  firebase_crashlytics: ^4.1.0
  firebase_analytics: ^11.3.0
  cached_network_image: ^3.4.0
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  mockito: ^5.4.4
  build_runner: ^2.4.7

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false 
  image_path: "assets/icon/mbeck_business_icon_1771008305067.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/audio/
    - assets/models/efficientnet_lite0_feature_vector.tflite
    - .env